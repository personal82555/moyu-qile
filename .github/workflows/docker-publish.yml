name: Publish Docker image to GHCR

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'server.js'
      - 'package.json'
      - 'app/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moyu-qile:latest
            ghcr.io/${{ github.repository_owner }}/moyu-qile:${{ github.run_number }}
            ghcr.io/${{ github.repository_owner }}/moyu-qile:20261008

      - name: Make package public (anonymous pull)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "/user/packages/container/moyu-qile" -f visibility=public \
            && echo "✅ 已设为 public" \
            || echo "⚠️ 未能通过 API 设为 public（若匿名拉取失败，需在 GitHub → Packages → moyu-qile 手动改为 Public）"

      - name: Verify anonymous pull
        continue-on-error: true
        run: |
          docker logout ghcr.io
          docker manifest inspect ghcr.io/${{ github.repository_owner }}/moyu-qile:latest >/dev/null \
            && echo "✅ 匿名可拉取（public 生效）" \
            || echo "⚠️ 匿名仍不可拉取（包还是 private）"

      # —— Docker Hub 双保险：凭据未配置时整段自动跳过，不影响 ghcr 流水线 ——
      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror image to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          docker buildx imagetools create \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/moyu-qile:latest" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/moyu-qile:${{ github.run_number }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/moyu-qile:20261008" \
            "ghcr.io/${{ github.repository_owner }}/moyu-qile:latest"
          echo "✅ 已镜像到 Docker Hub（同 digest，不重新构建）"

      - name: Verify Docker Hub anonymous pull
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        continue-on-error: true
        run: |
          docker logout docker.io
          docker manifest inspect "${{ secrets.DOCKERHUB_USERNAME }}/moyu-qile:latest" >/dev/null \
            && echo "✅ Docker Hub 匿名可拉取" \
            || echo "⚠️ Docker Hub 匿名拉取失败（仓库可能还是 private）"
